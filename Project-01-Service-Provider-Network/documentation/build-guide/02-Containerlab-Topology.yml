name: sp-routing-lab

mgmt:
  network: sp-routing-mgmt
  ipv4-subnet: 10.250.250.0/24

topology:
  nodes:
    P1:
      kind: linux
      image: quay.io/frrouting/frr:10.3.1
      binds:
        - /home/installer/Network-Engineering-Portfolio/Project-01-Service-Provider-Network/configs/P1/daemons:/etc/frr/daemons
        - /home/installer/Network-Engineering-Portfolio/Project-01-Service-Provider-Network/configs/P1/frr.conf:/etc/frr/frr.conf
        - /home/installer/Network-Engineering-Portfolio/Project-01-Service-Provider-Network/configs/P1/vtysh.conf:/etc/frr/vtysh.conf
      cap-add:
        - NET_ADMIN
        - SYS_ADMIN
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - sysctl -w net.mpls.platform_labels=100000
        - sysctl -w net.mpls.conf.eth1.input=1 
        - sysctl -w net.mpls.conf.eth2.input=1
    P2:
      kind: linux
      image: quay.io/frrouting/frr:10.3.1
      binds:
        - /home/installer/Network-Engineering-Portfolio/Project-01-Service-Provider-Network/configs/P2/daemons:/etc/frr/daemons
        - /home/installer/Network-Engineering-Portfolio/Project-01-Service-Provider-Network/configs/P2/frr.conf:/etc/frr/frr.conf
        - /home/installer/Network-Engineering-Portfolio/Project-01-Service-Provider-Network/configs/P2/vtysh.conf:/etc/frr/vtysh.conf
      cap-add:
        - NET_ADMIN
        - SYS_ADMIN
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - sysctl -w net.mpls.platform_labels=100000
        - sysctl -w net.mpls.conf.eth1.input=1 
        - sysctl -w net.mpls.conf.eth2.input=1
    PE1:
      kind: linux
      image: quay.io/frrouting/frr:10.3.1
      binds:
        - /home/installer/Network-Engineering-Portfolio/Project-01-Service-Provider-Network/configs/PE1/daemons:/etc/frr/daemons
        - /home/installer/Network-Engineering-Portfolio/Project-01-Service-Provider-Network/configs/PE1/frr.conf:/etc/frr/frr.conf
        - /home/installer/Network-Engineering-Portfolio/Project-01-Service-Provider-Network/configs/PE1/vtysh.conf:/etc/frr/vtysh.conf
      cap-add:
        - NET_ADMIN
        - SYS_ADMIN
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - sysctl -w net.mpls.platform_labels=100000
        - sysctl -w net.mpls.conf.eth1.input=1
    PE2:
      kind: linux
      image: quay.io/frrouting/frr:10.3.1
      binds:
        - /home/installer/Network-Engineering-Portfolio/Project-01-Service-Provider-Network/configs/PE2/daemons:/etc/frr/daemons
        - /home/installer/Network-Engineering-Portfolio/Project-01-Service-Provider-Network/configs/PE2/frr.conf:/etc/frr/frr.conf
        - /home/installer/Network-Engineering-Portfolio/Project-01-Service-Provider-Network/configs/PE2/vtysh.conf:/etc/frr/vtysh.conf
      cap-add:
        - NET_ADMIN
        - SYS_ADMIN
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - sysctl -w net.mpls.platform_labels=100000
        - sysctl -w net.mpls.conf.eth1.input=1
  links:
    - endpoints: ["PE1:eth1", "P1:eth2"]
    - endpoints: ["P1:eth1", "P2:eth1"]
    - endpoints: ["P2:eth2", "PE2:eth1"]     
